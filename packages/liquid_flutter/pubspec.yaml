name: liquid_flutter
description: A fluid, reactive state management framework enforcing Onion Architecture. Isolate UI and domain logic using Drops, Flows, Tubs, and Ripples.
version: 0.1.0
repository: https://example.com/liquid
publish_to: none

environment:
  sdk: ^3.10.9
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  liquid_core:
    path: ../liquid_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
